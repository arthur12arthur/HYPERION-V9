name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall .

      - name: Vérifier flake8 si installé
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "flake8 non installé : étape ignorée"
          fi

      - name: Lancer les tests pytest si présents
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || ls *_test.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "Aucun test détecté, étape ignorée"
          fi
