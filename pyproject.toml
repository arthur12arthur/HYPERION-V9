[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-v9"
version = "0.1.0"
description = "Hyperion V9 — Analyse LONAB Quotidienne"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "arthur12arthur"}
]
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "requests==2.31.0",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "firebase-admin==6.5.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
]

[tool.setuptools]
packages = ["src"]
