name: Hyperion v9 — Analyse LONAB Quotidienne

on:
  schedule:
    - cron: '0 9 * * *'   # 09h00 UTC = 09h00 Ouagadougou
    - cron: '0 11 * * *'  # 11h00 UTC = 11h00 Ouagadougou
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYY-MM-DD (vide = aujourd hui)'
        required: false
        default: ''

jobs:
  analyse-lonab:
    name: Analyse des courses LONAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Creer dossiers
        run: mkdir -p data/cache outputs logs

      - name: Lancer Hyperion V9
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          python main.py $ARGS

      - name: Upload resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-results-${{ github.run_id }}
          path: |
            outputs/
            logs/
            data/hyperion_v9.db
          retention-days: 39
